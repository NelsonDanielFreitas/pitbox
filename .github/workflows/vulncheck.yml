name: vulncheck

# Vulnerabilidades novas aparecem sem mudar código: correr o govulncheck todas as semanas.
# Não faz parte do ci-ok (não corre em PRs); se falhar, o GitHub avisa por email.

on:
  schedule:
    - cron: "17 5 * * 1" # segundas-feiras, 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: vulncheck
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml / mise.lock)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.8 # renovate: datasource=github-releases depName=jdx/mise
          install_args: --locked # exige o mise.lock (a ação já o faz sozinha com lockfile; explícito)

      - name: govulncheck
        run: make vuln
