version: "2"
# SQL gerado a partir do estado desejado (schema.sql), nunca das migrações.
# As queries da plataforma vivem em platform/<pacote>/queries (regra do backend).
sql:
  - engine: postgresql
    schema: db/schema/schema.sql
    queries: internal/platform/outbox/queries
    gen:
      go:
        package: sqlcgen
        out: internal/platform/outbox/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        omit_unused_structs: true

  - engine: postgresql
    schema: db/schema/schema.sql
    queries: internal/identity/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/identity/store/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            go_type: string
          - db_type: text
            nullable: true
            go_type:
              import: ""
              type: string
              pointer: true
          - db_type: bpchar
            go_type: string
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              import: ""
              type: string
              pointer: true
