# Rotas do Zitadel (equivalem às labels do compose oficial, sem o docker.sock).
# Prioridade mais alta = avaliada primeiro.
http:
  routers:
    zitadel-root:
      rule: Path(`/`)
      entryPoints: [web]
      middlewares: [zitadel-root-rewrite]
      service: zitadel-login
      priority: 400

    zitadel-login:
      rule: PathPrefix(`/ui/v2/login`)
      entryPoints: [web]
      service: zitadel-login
      priority: 250

    # Só as submissões de login (server actions do Next.js) são limitadas. GET,
    # RSC e /_next/ não gastam quota. `/api` não é usado pelo login v2 para
    # password; o contentor fala com o Zitadel directamente.
    zitadel-login-post:
      rule: PathPrefix(`/ui/v2/login`) && Method(`POST`)
      entryPoints: [web]
      middlewares: [zitadel-login-rate]
      service: zitadel-login
      priority: 300

    zitadel-api-alias:
      rule: PathPrefix(`/api`)
      entryPoints: [web]
      middlewares: [zitadel-strip-api]
      service: zitadel-api
      priority: 200

    zitadel-canonical:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: zitadel-api
      priority: 100

  middlewares:
    zitadel-login-rate:
      rateLimit:
        average: 10
        burst: 10
        period: 1m

    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/
    zitadel-strip-api:
      stripPrefix:
        prefixes: [/api]
        forceSlash: false

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: h2c://zitadel-api:8080
    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
