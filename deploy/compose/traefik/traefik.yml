# Configuração estática do proxy do Zitadel (só desenvolvimento local).
entryPoints:
  web:
    address: ":8080"

ping:
  entryPoint: web

providers:
  file:
    filename: /etc/traefik/dynamic.yml

api:
  dashboard: false
  insecure: false

log:
  level: INFO

# O login v2 envia códigos de uso único em query strings. O formato JSON + drop de
# RequestPath/RequestLine/queryParameters impede que fiquem em `docker compose logs`.
accessLog:
  format: json
  fields:
    names:
      RequestPath: drop
      RequestLine: drop
    queryParameters:
      defaultMode: drop
