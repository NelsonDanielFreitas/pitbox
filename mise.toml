# Toolchain do PitBox (cartão F0-02). Versões exatas: atualizar via Renovate/PR.
# Docker e o toolchain ESP (espup) não são geridos aqui; ver README.

[tools]
go = "1.27.2"
node = "22.23.3"
pnpm = "12.11.2"
rust = { version = "1.99.0", profile = "minimal", components = "rustfmt,clippy" }
buf = "1.73.0"
sqlc = "1.31.1"
atlas = "1.3.0"
golangci-lint = "2.14.0"
protoc-gen-go = "1.36.12"          # tem de coincidir com google.golang.org/protobuf (backend/go.mod)
protoc-gen-connect-go = "1.21.0"   # tem de coincidir com connectrpc.com/connect (backend/go.mod)
