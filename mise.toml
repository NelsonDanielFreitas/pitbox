# Toolchain do PitBox (cartão F0-02). Versões exatas: atualizar via Renovate/PR.
# Docker e o toolchain ESP (espup) não são geridos aqui; ver README.

[tools]
go = "1.27.2"
node = "24.21.0"
pnpm = "12.11.2"
rust = { version = "1.99.0", profile = "minimal", components = "rustfmt,clippy" }
buf = "1.73.0"
"github:sqlc-dev/sqlc" = "1.31.1"   # backend github: o registo aqua do sqlc não dá checksum para o mise.lock
atlas-community = "1.3.0"   # edição Apache 2.0 (ADR 0010): sem funcionalidades Pro nem login
golangci-lint = "2.14.0"
protoc-gen-go = "1.36.12"          # tem de coincidir com google.golang.org/protobuf (backend/go.mod); verificado por make gen-check
# Caminho explícito: o nome curto "protoc-gen-connect-go" do registo do mise aponta para a v1.
# Compilado pelo Go (sem checksum no mise.lock; protegido pelo checksum database do Go).
"go:connectrpc.com/connect/v2/cmd/protoc-gen-connect-go" = "2.0.0"   # tem de coincidir com connectrpc.com/connect/v2 (backend/go.mod); verificado por make gen-check
# CI e qualidade (F0-05)
gitleaks = "8.30.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"   # compilado pelo Go; protegido pelo checksum database do Go
actionlint = "1.7.12"
zizmor = "1.30.1"
