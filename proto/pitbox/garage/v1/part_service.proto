syntax = "proto3";

package pitbox.garage.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "pitbox/garage/v1/garage.proto";

// PartService manages the parts catalogue and its append-only stock movements.
// Quantities are hundredths of the part's unit (qty_centi); costs are cents.
// The unit cost is omitted for pilots. A movement that crosses the minimum
// writes one garage.stock_low event. A purchase records the price paid per unit
// (omitted for pilots, like the part's unit cost); a `lost` movement records why.
// reorder_to_centi is the level a purchase should restock to (default: the minimum). A part with a service life can be installed
// in a car or an engine (each installation is one unit); installing writes an
// `installed` movement (-1) and removing to stock writes a `returned` one (+1),
// in the same transaction as the installation row.
service PartService {
  rpc GetPart(GetPartRequest) returns (GetPartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPartInstalls(ListPartInstallsRequest) returns (ListPartInstallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreatePart(CreatePartRequest) returns (CreatePartResponse);
  rpc UpdatePart(UpdatePartRequest) returns (UpdatePartResponse);
  rpc DeletePart(DeletePartRequest) returns (DeletePartResponse);
  rpc AddStockMovement(AddStockMovementRequest) returns (AddStockMovementResponse);
  rpc InstallPart(InstallPartRequest) returns (InstallPartResponse);
  rpc RemovePart(RemovePartRequest) returns (RemovePartResponse);
}

// Where a removed part goes. STOCK returns one unit to the stock; SCRAP writes
// off the unit and needs a reason; SPARE keeps it outside the stock.
enum RemovalDestination {
  REMOVAL_DESTINATION_UNSPECIFIED = 0;
  REMOVAL_DESTINATION_STOCK = 1;
  REMOVAL_DESTINATION_SCRAP = 2;
  REMOVAL_DESTINATION_SPARE = 3;
}

// Why a unit was scrapped. Only valid with REMOVAL_DESTINATION_SCRAP.
enum RemovalReason {
  REMOVAL_REASON_UNSPECIFIED = 0;
  REMOVAL_REASON_BROKEN = 1;
  REMOVAL_REASON_WORN = 2;
  REMOVAL_REASON_LOST = 3;
}

// PartInstall is one installation of one unit of a part in a car or an engine.
// run_seconds and sessions stay at zero until usage accounting (F2-04).
message PartInstall {
  string id = 1;
  string part_id = 2;
  oneof target {
    string car_id = 3;
    string engine_id = 4;
  }
  google.protobuf.Timestamp installed_at = 5;
  optional google.protobuf.Timestamp removed_at = 6;
  RemovalDestination removal_destination = 7;
  RemovalReason removal_reason = 8;
  int32 run_seconds = 9;
  int32 sessions = 10;
  int32 version = 11;
}

message Part {
  string id = 1;
  PartKind kind = 2;
  optional string brand = 3;
  optional string reference = 4;
  string description = 5;
  string unit = 6;
  google.protobuf.Struct specs = 7;
  int64 min_stock_centi = 8;
  optional int32 unit_cost_cents = 9;
  string currency = 10;
  bool has_service_life = 11;
  int64 qty_centi = 12;
  bool below_min = 13;
  google.protobuf.Timestamp created_at = 14;
  int32 version = 15;
  optional int64 reorder_to_centi = 16;
}

message StockMovement {
  string id = 1;
  string part_id = 2;
  int64 qty_delta_centi = 3;
  StockReason reason = 4;
  optional string note = 5;
  google.protobuf.Timestamp occurred_at = 6;
  // Price paid per unit, only on purchases; omitted for pilots.
  optional int32 unit_cost_cents = 7;
  LossReason loss_reason = 8;
}

message GetPartRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string part_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetPartResponse {
  Part part = 1;
}

message ListPartsRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

message ListPartsResponse {
  repeated Part parts = 1;
  string next_page_token = 2;
}

message ListStockMovementsRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string part_id = 2 [(buf.validate.field).string.uuid = true];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 4 [(buf.validate.field).string.max_len = 512];
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
  string next_page_token = 2;
}

message CreatePartRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  PartKind kind = 3 [(buf.validate.field).enum.defined_only = true];
  optional string brand = 4 [(buf.validate.field).string.max_len = 80];
  optional string reference = 5 [(buf.validate.field).string.max_len = 80];
  string description = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string unit = 7 [(buf.validate.field).string = {
    max_len: 16
    in: [
      "",
      "un",
      "ml",
      "l",
      "g"
    ]
  }];
  google.protobuf.Struct specs = 8;
  int64 min_stock_centi = 9 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9999999999
  }];
  optional int32 unit_cost_cents = 10 [(buf.validate.field).int32.gte = 0];
  string currency = 11 [(buf.validate.field).string.max_len = 3];
  bool has_service_life = 12;
  int64 initial_qty_centi = 13 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9999999999
  }];
  // Restock target; must not be below min_stock_centi.
  optional int64 reorder_to_centi = 14 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9999999999
  }];
}

message CreatePartResponse {
  Part part = 1;
}

message UpdatePartRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  int32 version = 3 [(buf.validate.field).int32.gte = 1];
  google.protobuf.FieldMask update_mask = 4 [(buf.validate.field).required = true];
  PartKind kind = 5 [(buf.validate.field).enum.defined_only = true];
  optional string brand = 6 [(buf.validate.field).string.max_len = 80];
  optional string reference = 7 [(buf.validate.field).string.max_len = 80];
  string description = 8 [(buf.validate.field).string.max_len = 200];
  string unit = 9 [(buf.validate.field).string = {
    max_len: 16
    in: [
      "",
      "un",
      "ml",
      "l",
      "g"
    ]
  }];
  google.protobuf.Struct specs = 10;
  int64 min_stock_centi = 11 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9999999999
  }];
  optional int32 unit_cost_cents = 12 [(buf.validate.field).int32.gte = 0];
  string currency = 13 [(buf.validate.field).string.max_len = 3];
  bool has_service_life = 14;
  string part_id = 15 [(buf.validate.field).string.uuid = true];
  optional int64 reorder_to_centi = 16 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9999999999
  }];
}

message UpdatePartResponse {
  Part part = 1;
}

message DeletePartRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  string part_id = 3 [(buf.validate.field).string.uuid = true];
  int32 version = 4 [(buf.validate.field).int32.gte = 1];
}

message DeletePartResponse {}

message AddStockMovementRequest {
  option (buf.validate.message).cel = {
    id: "stock_movement.unit_cost"
    message: "a unit cost is only allowed on a purchase"
    expression: "!has(this.unit_cost_cents) || this.reason == 1"
  };
  option (buf.validate.message).cel = {
    id: "stock_movement.loss_reason"
    message: "a loss reason is required for a lost movement and not allowed otherwise"
    expression: "(this.reason == 5) == (this.loss_reason != 0)"
  };
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  string part_id = 3 [(buf.validate.field).string.uuid = true];
  int64 qty_delta_centi = 4 [(buf.validate.field).int64 = {
    gte: -9999999999
    lte: 9999999999
  }];
  StockReason reason = 5 [(buf.validate.field).enum.defined_only = true];
  optional string note = 6 [(buf.validate.field).string.max_len = 500];
  optional int32 unit_cost_cents = 7 [(buf.validate.field).int32.gte = 0];
  LossReason loss_reason = 8 [(buf.validate.field).enum.defined_only = true];
}

message AddStockMovementResponse {
  Part part = 1;
  StockMovement movement = 2;
}

message InstallPartRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  string part_id = 3 [(buf.validate.field).string.uuid = true];
  oneof target {
    option (buf.validate.oneof).required = true;
    string car_id = 4 [(buf.validate.field).string.uuid = true];
    string engine_id = 5 [(buf.validate.field).string.uuid = true];
  }
  // Defaults to the server time; a client that was offline may send the real time.
  optional google.protobuf.Timestamp installed_at = 6 [(buf.validate.field).timestamp.lt_now = true];
  optional string note = 7 [(buf.validate.field).string.max_len = 500];
}

message InstallPartResponse {
  PartInstall install = 1;
  Part part = 2;
}

message RemovePartRequest {
  option (buf.validate.message).cel = {
    id: "remove_part.reason"
    message: "a reason is required for scrap and not allowed otherwise"
    expression: "(this.destination == 2) == (this.reason != 0)"
  };
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  string install_id = 3 [(buf.validate.field).string.uuid = true];
  RemovalDestination destination = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  RemovalReason reason = 5 [(buf.validate.field).enum.defined_only = true];
  optional string note = 6 [(buf.validate.field).string.max_len = 500];
}

message RemovePartResponse {
  PartInstall install = 1;
  Part part = 2;
}

message ListPartInstallsRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  oneof filter {
    option (buf.validate.oneof).required = true;
    string part_id = 2 [(buf.validate.field).string.uuid = true];
    string car_id = 3 [(buf.validate.field).string.uuid = true];
    string engine_id = 4 [(buf.validate.field).string.uuid = true];
  }
  // false lists only the active installations.
  bool include_history = 5;
  int32 page_size = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 7 [(buf.validate.field).string.max_len = 512];
}

message ListPartInstallsResponse {
  repeated PartInstall installs = 1;
  string next_page_token = 2;
}
